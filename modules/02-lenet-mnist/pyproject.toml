[project]
name = "lenet-mnist"
version = "1.0"
description = "Train LeNet-5 to read handwritten digits"
requires-python = "==3.12.*"
dependencies = [
    "ipykernel",
    "matplotlib",
    "numpy",
    "torch==2.15.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
