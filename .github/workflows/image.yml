name: image

on:
  pull_request:
  push:
    branches: [main]
    tags: ["20*"]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: docker build -t lab .

      # Every lesson must run from start to finish inside the image, in the
      # same way a student would run it, within the time budget.
      - name: Run the lessons
        run: |
          docker run --rm -e MPLBACKEND=Agg lab sh -c '
            set -e
            cp -r /opt/lab/modules .
            for dir in modules/*/; do
              name=$(basename "$dir")
              for lesson in "$dir"lesson*.py; do
                echo "::group::$lesson"
                (cd "$dir" && timeout 10m "/opt/lab/envs/$name/bin/python" "$(basename "$lesson")")
                echo "::endgroup::"
              done
            done'

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image names on GHCR must be lower case; metadata-action takes care of it.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
